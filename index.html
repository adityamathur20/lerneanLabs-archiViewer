<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>archiAgent · IFC viewer</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f25;
        --line: #2b3038;
        --text: #e6e8ec;
        --muted: #949aa6;
        --accent: #6c8cff;
        --warn: #e8833a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        grid-template-columns: 320px 1fr;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px;
        overflow-y: auto;
      }
      h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
      .sub { color: var(--muted); font-size: 11px; margin-bottom: 18px; }
      h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
        color: var(--muted); margin: 20px 0 8px; font-weight: 600;
      }
      select, button {
        width: 100%; background: #23272f; color: var(--text);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 7px 9px; font: inherit;
      }
      button { cursor: pointer; margin-top: 6px; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: default; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 2px 0; vertical-align: top; }
      td:first-child { color: var(--muted); width: 45%; }
      td:last-child { font-variant-numeric: tabular-nums; }
      label.row {
        display: flex; align-items: center; gap: 8px;
        padding: 3px 0; cursor: pointer;
      }
      #notes { color: var(--warn); font-size: 11px; white-space: pre-wrap; }
      #pick { font-size: 11px; }
      #pick .none { color: var(--muted); }
      #status {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: var(--muted); font-size: 12px;
      }
      main { position: relative; }
      canvas { display: block; }
      code { color: var(--accent); font-size: 11px; word-break: break-all; }
    </style>
  </head>
  <body>
    <aside>
      <h1>archiAgent → Fragments</h1>
      <div class="sub">The authored IFC, rendered as written</div>

      <h2>Convert</h2>
      <div id="upload">
        <input id="file" type="file" accept=".dxf,.pdf" />
        <label class="row" style="margin-top:6px" title="archiAgent will not guess a scale. Tick this to use the dimensions written in the drawing.">
          <input id="trustScale" type="checkbox" />
          <span style="flex:1">Use the drawing's own dimensions for scale</span>
        </label>
        <button id="convert" style="margin-top:6px">Convert to IFC</button>
        <div class="sub" id="progress" style="margin-top:6px"></div>
      </div>

      <h2>Model</h2>
      <select id="manifests"><option value="">loading…</option></select>
      <button id="reload">Reload</button>
      <div class="sub" id="root" style="margin-top:8px"></div>
      <div id="auth" style="margin-top:8px; display:none">
        <input id="apiKey" type="password" placeholder="API key (ak_…)" style="width:100%" />
        <button id="saveKey" style="margin-top:4px">Save key</button>
      </div>

      <h2>Source</h2>
      <div id="source"><span class="none">—</span></div>

      <h2>Model info</h2>
      <table id="stats"></table>

      <h2>Display</h2>
      <label class="row"><input type="checkbox" id="showGrid" checked /> Grid</label>

      <h2>Selection</h2>
      <div id="pick"><span class="none">Click an element</span></div>

      <h2>Notes</h2>
      <div id="notes"></div>
    </aside>
    <main><div id="status">loading…</div></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
