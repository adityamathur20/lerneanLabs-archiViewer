services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archiagent
      POSTGRES_PASSWORD: archiagent
      POSTGRES_DB: archiagent
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiagent"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # S3 stands in as Adobe's S3Mock. MinIO's images are no longer publicly
  # pullable (Docker Hub and quay.io both 401 as of 2026-09-27), and
  # localstack:latest is now a licensed Pro build that exits 55 without a token.
  # S3Mock is free, purpose-built and speaks the S3 API including presigned
  # URLs, so pointing at genuine AWS later is an endpoint change, not a rewrite.
  s3:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: archiagent
      root: /data
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      retries: 20
