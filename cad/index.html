<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>archiAgent · Drawing</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f25;
        --line: #2b3038;
        --text: #e6e8ec;
        --muted: #949aa6;
        --accent: #6c8cff;
        --warn: #e8833a;
      }
      * { box-sizing: border-box; }
      /* The buttons below set display: block, which would beat [hidden]. */
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        grid-template-columns: 320px 1fr;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px;
        overflow-y: auto;
      }
      h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
      .sub { color: var(--muted); font-size: 11px; margin-bottom: 18px; }
      h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
        color: var(--muted); margin: 20px 0 8px; font-weight: 600;
      }
      .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch .track {
        width: 34px; height: 18px; border-radius: 9px; background: #3a404a; position: relative;
        flex: none; transition: background .15s;
      }
      .switch .track::after {
        content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
        border-radius: 50%; background: var(--text); transition: transform .15s;
      }
      .switch input:checked + .track { background: var(--accent); }
      .switch input:checked + .track::after { transform: translateX(16px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
      .switch input:disabled + .track { opacity: .4; }
      .switch input:disabled ~ span:last-child { color: var(--muted); }
      .wallRow { margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
      .rowHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .rowTitle { font-size: 11px; color: var(--muted); }
      button.remove { width: 24px; height: 24px; padding: 0; margin: 0; line-height: 1; }
      #toolstrip {
        position: absolute; right: 12px; top: 70px; z-index: 5;
        display: flex; flex-direction: column; gap: 6px; padding: 6px;
        background: rgba(28, 31, 37, .92); border: 1px solid var(--line); border-radius: 8px;
      }
      #toolstrip button { width: 36px; height: 36px; padding: 0; margin: 0; display: grid; place-items: center; }
      #toolstrip button.active { border-color: var(--accent); background: #2b3350; }
      #toolstrip svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      input[type="text"] {
        display: block; width: 100%; margin-top: 6px; background: #23272f; color: var(--text);
        border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit;
      }
      select, button, a.button {
        display: block; width: 100%; background: #23272f; color: var(--text);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 7px 9px; font: inherit; text-align: center; text-decoration: none;
      }
      select { text-align: left; }
      button, a.button { cursor: pointer; margin-top: 6px; }
      button:hover:not(:disabled), a.button:hover { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: default; }
      button.active { border-color: var(--accent); color: var(--accent); }
      a.button[aria-disabled="true"] { opacity: .45; pointer-events: none; }
      .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .tools button { margin-top: 0; }
      #layers { max-height: 40vh; overflow-y: auto; }
      label.row {
        display: flex; align-items: center; gap: 8px;
        padding: 2px 0; cursor: pointer; overflow-wrap: anywhere;
      }
      label.row .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      #notes { color: var(--warn); font-size: 11px; white-space: pre-wrap; }
      main { position: relative; min-width: 0; }
      #cad { position: absolute; inset: 0; }
      #status {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: var(--muted); font-size: 12px; z-index: 10; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>archiAgent → Drawing</h1>
      <div class="sub">The drawing archiAgent read: your DXF, or ODA's conversion of your DWG</div>

      <h2>Drawing</h2>
      <select id="drawings"><option value="">loading…</option></select>
      <button id="reload">Reload</button>
      <a class="button" id="toModel" href="/" aria-disabled="true">Open 3D model</a>
      <div class="sub" id="root" style="margin-top:8px"></div>
      <div id="auth" style="margin-top:8px; display:none">
        <div class="sub">Enter your API key in the 3D view, then come back.</div>
        <a class="button" href="/">Go to the 3D view</a>
      </div>

      <h2>Scale</h2>
      <label class="switch">
        <input id="useDims" type="checkbox" role="switch" disabled />
        <span class="track"></span>
        <span>Use the drawing's dimensions</span>
      </label>
      <div class="sub" id="dimsReason" style="margin-top:4px"></div>
      <div id="wallRows"></div>
      <button id="pickWall">Measure a wall</button>
      <div class="sub" id="scaleEvidence" style="margin-top:6px"></div>
      <div class="sub" id="scaleReadout" style="margin-top:6px"></div>
      <button id="convertScale" disabled>Convert with this scale</button>

      <h2>View</h2>
      <div class="tools">
        <button id="fit">Fit drawing</button>
        <button id="measure">Measure distance</button>
      </div>
      <button id="clearMeasures">Clear measurements</button>
      <div class="sub" id="hint" style="margin-top:6px"></div>

      <h2>Layers</h2>
      <div class="tools">
        <button id="allOn">All on</button>
        <button id="allOff">All off</button>
      </div>
      <div id="layers" style="margin-top:8px"><span class="sub">—</span></div>

      <h2>Notes</h2>
      <div id="notes"></div>
    </aside>
    <main>
      <div id="cad"></div>
      <div id="toolstrip" role="toolbar" aria-label="Mouse tool">
        <button id="toolPointer" class="active" title="Pointer: select, measure and pick walls" aria-label="Pointer" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg>
        </button>
        <button id="toolHand" title="Hand: drag to pan" aria-label="Hand" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 013 0v5m0-6.5a1.5 1.5 0 013 0V11m0-5a1.5 1.5 0 013 0v7.5c0 4-2.5 6.5-6 6.5-2.6 0-4-1.2-5.5-3.4L4.3 14a1.5 1.5 0 012.4-1.7L8 14"/></svg>
        </button>
      </div>
      <div id="status">loading…</div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
