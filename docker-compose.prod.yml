# Only caddy publishes ports (spec §3). Everything else is reachable on this
# network alone — Garage especially, whose S3 endpoint must never bind a
# public interface.
name: planto3d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      VIEWER_ORIGIN: ${VIEWER_ORIGIN}
      # `:-` covers empty AND unset; Caddy's own {$VAR:default} covers only
      # unset, and an empty value is a fatal parse error (not a fallback).
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/viewer:ro
      # NAMED, and this matters more than it looks: /data holds the account key
      # and every issued certificate. On an anonymous volume a redeploy starts
      # from nothing, re-requests all five certificates, and Let's Encrypt's
      # duplicate-certificate limit then locks TLS out for a week. Never change
      # these two to anonymous or bind mounts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archiagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: archiagent
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiagent"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # The scratch image carries /garage, and `garage status` is what
    # provision-garage.sh already uses as its readiness probe — so compose CAN
    # order startup behind it. Exec form, because there is no shell in scratch.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 20

  api:
    # Both keys on purpose: `pull` is the normal path, `build` still works if
    # CI is down, and IMAGE_TAG=<sha> is the rollback.
    image: ghcr.io/adityamathur20/planto3d-api:${IMAGE_TAG:-latest}
    build: ./service
    restart: unless-stopped
    # Named variables, NOT `env_file: [.env]`. The api has no use for
    # ANTHROPIC_API_KEY (spec §6 says worker only), and none at all for
    # GARAGE_ADMIN_TOKEN — which it could otherwise carry to garage:3903 on
    # this network and mint keys or delete buckets with. Least privilege is
    # cheap here and limits the blast radius of an api-tier compromise.
    environment:
      ARCHIAGENT_SERVICE_DATABASE_URL: postgresql+psycopg://archiagent:${POSTGRES_PASSWORD}@postgres:5432/archiagent
      ARCHIAGENT_SERVICE_REDIS_URL: redis://redis:6379/0
      ARCHIAGENT_SERVICE_S3_ENDPOINT: ${ARCHIAGENT_SERVICE_S3_ENDPOINT}
      ARCHIAGENT_SERVICE_S3_BUCKET: ${ARCHIAGENT_SERVICE_S3_BUCKET}
      ARCHIAGENT_SERVICE_S3_ACCESS_KEY: ${ARCHIAGENT_SERVICE_S3_ACCESS_KEY}
      ARCHIAGENT_SERVICE_S3_SECRET_KEY: ${ARCHIAGENT_SERVICE_S3_SECRET_KEY}
      ARCHIAGENT_SERVICE_CORS_ORIGINS: ${ARCHIAGENT_SERVICE_CORS_ORIGINS}
      # The api enqueues, so it is the side that sets the job's timeout.
      ARCHIAGENT_SERVICE_QUEUE_TIMEOUT_S: ${ARCHIAGENT_SERVICE_QUEUE_TIMEOUT_S:-7200}
      # This container cannot see the worker's ODA File Converter, so it is
      # told: Dockerfile.worker installs it. Literal, like the LLM settings,
      # because it is a property of the image, not of the host.
      ARCHIAGENT_SERVICE_DWG_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      garage: {condition: service_healthy}
    # No boot-time store probe: S3_ENDPOINT is the PUBLIC https host, so any
    # such check would need Caddy already serving a trusted certificate. On
    # Let's Encrypt staging — which the runbook tells you to start on — the
    # certificate is untrusted by design and boto3 refuses it, so both services
    # crash-looped forever. Ordering is the garage healthcheck's job.
    command: ["uvicorn", "archiagent_service.api:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    image: ghcr.io/adityamathur20/planto3d-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: archiagent-viewer/service/Dockerfile.worker
    restart: unless-stopped
    # The worker is the only tier that calls an LLM, so it is the only one
    # given the key. Garage's RPC and admin secrets stay with garage.
    environment:
      ARCHIAGENT_SERVICE_DATABASE_URL: postgresql+psycopg://archiagent:${POSTGRES_PASSWORD}@postgres:5432/archiagent
      ARCHIAGENT_SERVICE_REDIS_URL: redis://redis:6379/0
      ARCHIAGENT_SERVICE_S3_ENDPOINT: ${ARCHIAGENT_SERVICE_S3_ENDPOINT}
      ARCHIAGENT_SERVICE_S3_BUCKET: ${ARCHIAGENT_SERVICE_S3_BUCKET}
      ARCHIAGENT_SERVICE_S3_ACCESS_KEY: ${ARCHIAGENT_SERVICE_S3_ACCESS_KEY}
      ARCHIAGENT_SERVICE_S3_SECRET_KEY: ${ARCHIAGENT_SERVICE_S3_SECRET_KEY}
      # The LLM. archiAgent reaches NVIDIA's OpenAI-compatible endpoint with
      # provider 'openai' plus a base URL, so OPENAI_API_KEY holds the
      # nvapi-… key. Measured working with strict json_schema, which the
      # classifier requires and many compatible endpoints do not support.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # LITERAL, not ${...}: compose gives the HOST SHELL precedence over
      # .env, so an operator with ARCHIAGENT_LLM_MODEL exported in their
      # profile would silently deploy a different model than .env documents.
      # That happened during setup — a profile exporting moonshotai/kimi-k3
      # overrode .env's llama and nothing warned. These three are deliberate
      # deployment decisions, so they live in git where a change is reviewable;
      # only the secret comes from the environment.
      ARCHIAGENT_LLM_PROVIDER: "openai"
      ARCHIAGENT_LLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
      # kimi-k3, chosen on measurement rather than size. Against the same
      # drawing, llama-3.2-90b made ONE text call and skipped both the vision
      # escalation and wall adjudication entirely (154 walls, ~9 min, and
      # separately observed hanging 4h15m before a 504). kimi-k3 ran the full
      # pipeline — 1 text + 5 vision classify + 5 vision adjudication — in
      # 2m37s and found 169 walls. It costs ~15x the input tokens (52k vs
      # 3.5k) to do the work the 90b was not doing.
      #
      # llama-3.2-11b is NOT a fallback: it is fast but emitted 2600 tokens of
      # invalid JSON on the real prompt. An endpoint ACCEPTING json_schema does
      # not mean the model honours it, so any model swap must be re-verified
      # against a real drawing, never a toy prompt.
      ARCHIAGENT_LLM_MODEL: "moonshotai/kimi-k3"
      # A PER-CALL ceiling, and it is not optional. Left unset, a stalled
      # provider is effectively unbounded: a two-token completion against
      # NVIDIA's llama-3.2-90b was measured hanging 4h15m before returning a
      # 504. With one worker at concurrency 1 that is the whole service
      # stopped by someone else's capacity problem.
      #
      # Well below ARCHIAGENT_SERVICE_CLI_TIMEOUT_S on purpose: the CLI
      # timeout killing the process records "archiagent timed out", while an
      # LLM timeout inside it records which provider failed and why.
      ARCHIAGENT_LLM_TIMEOUT: "900"
      ARCHIAGENT_SERVICE_CLI_TIMEOUT_S: ${ARCHIAGENT_SERVICE_CLI_TIMEOUT_S:-5400}
      ARCHIAGENT_SERVICE_QUEUE_TIMEOUT_S: ${ARCHIAGENT_SERVICE_QUEUE_TIMEOUT_S:-7200}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      garage: {condition: service_healthy}
    command: ["rq", "worker", "archiagent", "--url", "redis://redis:6379/0"]

volumes:
  caddy_data: {}
  caddy_config: {}
  pg_data: {}
  redis_data: {}
  garage_meta: {}
  garage_data: {}
